[mypy]
# CI runs `mypy . --ignore-missing-imports` from the repo root for a broad sweep.
# Each Python service owns a `tests/` package, so a root-level walk sees more than
# one module named `tests` and errors with "Duplicate module named". Each service
# already runs its own mypy with strict settings via its own pyproject.toml (e.g.
# `cd ml-signal-service && mypy src/`, `cd analytics-service && mypy src/`), so
# the root sweep can safely skip the per-service test packages and venvs.
exclude = (?x)(
    ^ml-signal-service/tests/
    | ^analytics-service/tests/
    | ^.*/\.venv/
    | ^.*/__pycache__/
  )

# PyYAML ships no inline types. The per-service venvs install `types-PyYAML` (declared in
# analytics-service/requirements-dev.txt), but CI's root sweep installs only ruff/mypy/pytest, and
# `--ignore-missing-imports` deliberately does NOT silence `import-untyped` for packages mypy knows
# have stubs on PyPI. Declaring it here keeps the root sweep and the per-service run in agreement
# whether or not the stubs happen to be present.
[mypy-yaml]
ignore_missing_imports = True

[mypy-yaml.*]
ignore_missing_imports = True
